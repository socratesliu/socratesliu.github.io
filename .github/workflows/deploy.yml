name: Deploy to GitHub Pages

on:
  # 每次推送到 main 分支都会触发部署
  push:
    branches: [main]
  # 允许在 GitHub Actions 页面手动触发
  workflow_dispatch:

# 权限最小化:只读源码 + 写 Pages + 签发 OIDC token
permissions:
  contents: read
  pages: write
  id-token: write

# Pages 同一时间只允许一个部署任务,避免互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build, and upload site output
        uses: withastro/action@v6
        # withastro/action 会自动完成:装依赖 -> npm run build -> 上传 Pages artifact
        # 默认使用 Node 24,产物目录为 dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
